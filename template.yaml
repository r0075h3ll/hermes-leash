AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Run NousResearch Hermes Agent on EC2 with SSM access, email billing alerts,
  and an automatic EC2 stop when the monthly AWS budget is exceeded.

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
  HermesEnvSecretArn:
    Type: String
    Description: Secrets Manager ARN containing dotenv-formatted secrets, including TELEGRAM_BOT_TOKEN.
  HermesAuthSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the contents of the local Hermes ~/.hermes/auth.json.
  HermesConfigSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the contents of the local Hermes ~/.hermes/config.yaml.
  AlertEmail:
    Type: String
    Description: Address that must confirm the SNS subscription.
  EnableIdleShutdown:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Stop the instance automatically after IdleTimeoutMinutes with no inbound Telegram messages.
  IdleTimeoutMinutes:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Minutes of Telegram inactivity before the instance stops itself.
  EnableThreatFoxBlock:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Block outbound traffic to ThreatFox IOCs (abuse.ch) via nftables, refreshed every 30 minutes.
  DailyShutdownSchedule:
    Type: String
    Default: 'cron(0 5 * * ? *)'
    Description: UTC cron for the nightly graceful shutdown (default 05:00 UTC). Disable the rule after deploy if you don't want it.
  BudgetLimitUsd:
    Type: Number
    Default: 10
    MinValue: 0.01
    Description: Monthly account-wide USD budget. The EC2 instance is stopped automatically at this amount.
  BillingAlarmThresholdUsd:
    Type: Number
    Default: 10
    MinValue: 0.01
    Description: Monthly account-wide USD threshold for the CloudWatch billing alarm.

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; administer Hermes through SSM
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-hermes'

  HermesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadHermesSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref HermesEnvSecretArn
                  - !Ref HermesAuthSecretArn
                  - !Ref HermesConfigSecretArn
        - PolicyName: PublishIdleShutdownNotice
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref BillingTopic

  HermesInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HermesRole

  HermesInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT20M
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !GetAtt InstanceSecurityGroup.GroupId
      IamInstanceProfile: !Ref HermesInstanceProfile
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-hermes'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y awscli-2 git tar xz libatomic gcc-c++ make nftables jq
          useradd --create-home --shell /bin/bash hermes || true
          install -d -o hermes -g hermes /home/hermes/.hermes

          runuser -u hermes -- bash -lc 'curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --non-interactive'
          runuser -u hermes -- bash -lc 'mkdir -p ~/.hermes && aws secretsmanager get-secret-value --secret-id ${HermesEnvSecretArn} --query SecretString --output text > ~/.hermes/.env && chmod 600 ~/.hermes/.env'
          runuser -u hermes -- bash -lc 'aws secretsmanager get-secret-value --secret-id ${HermesAuthSecretArn} --query SecretString --output text > ~/.hermes/auth.json && chmod 600 ~/.hermes/auth.json'
          runuser -u hermes -- bash -lc 'aws secretsmanager get-secret-value --secret-id ${HermesConfigSecretArn} --query SecretString --output text > ~/.hermes/config.yaml && chmod 600 ~/.hermes/config.yaml'

          cat > /etc/systemd/system/hermes.service <<'SERVICE'
          [Unit]
          Description=Hermes Agent gateway
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=hermes
          WorkingDirectory=/home/hermes
          Environment=HOME=/home/hermes
          Environment=HERMES_HOME=/home/hermes/.hermes
          ExecStart=/home/hermes/.local/bin/hermes gateway
          Restart=on-failure
          RestartSec=10
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable --now hermes.service

          # Idle shutdown monitor: greps gateway.log for real Telegram messages.
          # Publishes to SNS then shuts down if no inbound messages for IDLE_MINUTES.
          cat > /home/hermes/check-idle.sh <<'IDLESCRIPT'
          #!/usr/bin/env bash
          # Idle shutdown monitor: greps gateway.log for real Telegram messages.
          # Publishes to SNS then shuts down if no inbound messages for IDLE_MINUTES.
          set -euo pipefail

          IDLE_MINUTES=${IdleTimeoutMinutes}
          LOGFILE="/home/hermes/.hermes/logs/gateway.log"
          SNS_TOPIC="${BillingTopic}"
          OVERRIDE_FILE="/home/hermes/.idle-shutdown-disabled"

          if [[ -f "$OVERRIDE_FILE" ]]; then
            exit 0
          fi

          if [[ ! -f "$LOGFILE" ]]; then
            exit 0
          fi

          last_line=$(grep "inbound message" "$LOGFILE" | tail -1 || true)
          if [[ -z "$last_line" ]]; then
            exit 0
          fi

          ts=$(echo "$last_line" | cut -d' ' -f1-2)
          ts_clean=$(echo "$ts" | sed 's/,.*//')
          last_epoch=$(date -d "$ts_clean" +%s 2>/dev/null) || exit 0
          now_epoch=$(date +%s)
          diff=$(( now_epoch - last_epoch ))
          idle_limit=$(( IDLE_MINUTES * 60 ))

          logger -t hermes-idle "Last message $(( diff / 60 ))m ago"

          if [[ $diff -ge $idle_limit ]]; then
            logger -t hermes-idle "Idle for $(( diff / 60 ))m — shutting down"
            aws sns publish --region ${AWS::Region} --topic-arn "$SNS_TOPIC" \
              --subject "Hermes idle shutdown" \
              --message "Hermes idle for $(( diff / 60 ))m. Instance shutting down." || true
            shutdown -h now
          fi
          IDLESCRIPT
          chmod +x /home/hermes/check-idle.sh
          chown hermes:hermes /home/hermes/check-idle.sh
          if [[ "${EnableIdleShutdown}" != "true" ]]; then touch /home/hermes/.idle-shutdown-disabled; fi

          cat > /etc/systemd/system/hermes-idle-check.service <<'IDLESVC'
          [Unit]
          Description=Hermes idle shutdown monitor
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/home/hermes/check-idle.sh
          IDLESVC

          cat > /etc/systemd/system/hermes-idle-check.timer <<'IDLETIMER'
          [Unit]
          Description=Run Hermes idle check every 60s

          [Timer]
          OnBootSec=120
          OnUnitActiveSec=60

          [Install]
          WantedBy=timers.target
          IDLETIMER

          systemctl daemon-reload
          systemctl enable --now hermes-idle-check.timer

          # ThreatFox IOC firewall, blocking outbound traffic to ThreatFox-listed IPs
          # from the abuse.ch feed. A failed fetch doesn't fail bootstrap. The timer retries.
          if [[ "${EnableThreatFoxBlock}" == "true" ]]; then
          cat > /usr/local/bin/threatfox-block.sh <<'BLOCKSCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          FEED_URL="https://threatfox.abuse.ch/export/json/recent/"
          MIN_CONF=80
          STATE_FILE="/var/lib/threatfox-block/blocked.txt"
          RULESET_FILE="/var/lib/threatfox-block/apply.nft"
          LOG_FILE="/var/log/threatfox-block.log"

          mkdir -p /var/lib/threatfox-block

          log() {
            echo "$(date -Is) $*" >> "$LOG_FILE"
          }

          TMP=$(mktemp)
          trap 'rm -f "$TMP" "$TMP.new" "$TMP.add"' EXIT

          if curl -fsSL --max-time 60 "$FEED_URL" > "$TMP"; then
            jq -r '.[][] |
              select(.confidence_level >= 80 and (.ioc_type == "ip" or .ioc_type == "ip:port")) |
              .ioc_value' "$TMP" \
              | sed -E 's/^([0-9.]+):[0-9]+$/\1/' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -u > "$TMP.new"

            touch "$STATE_FILE"
            sort -u -o "$STATE_FILE" "$STATE_FILE"

            comm -13 "$STATE_FILE" "$TMP.new" > "$TMP.add"
            if [ -s "$TMP.add" ]; then
              cat "$TMP.add" >> "$STATE_FILE"
              sort -u -o "$STATE_FILE" "$STATE_FILE"
            fi
          else
            log "WARN: feed fetch failed, reapplying last known rules"
            : > "$TMP.add"
          fi

          {
            echo "table ip threatfox {"
            echo "  set blocked {"
            echo "    type ipv4_addr;"
            if [ -s "$STATE_FILE" ]; then
              echo "    elements = {"
              paste -sd, "$STATE_FILE"
              echo "    }"
            fi
            echo "  }"
            echo "  chain out {"
            echo "    type filter hook output priority 0; policy accept;"
            echo "    ip daddr @blocked log prefix \"threatfox-block: \" limit rate 1/second burst 50 packets"
            echo "    ip daddr @blocked reject"
            echo "    ip daddr @blocked drop"
            echo "  }"
            echo "}"
          } > "$RULESET_FILE"

          nft list table ip threatfox >/dev/null 2>&1 && nft delete table ip threatfox
          if nft -f "$RULESET_FILE" 2>>"$LOG_FILE"; then
            added=$(wc -l < "$TMP.add")
            total=$(wc -l < "$STATE_FILE")
            log "OK: $added new IP(s) blocked, total $total"
          else
            log "ERROR: nft apply failed"
            exit 1
          fi
          BLOCKSCRIPT
          chmod +x /usr/local/bin/threatfox-block.sh

          cat > /etc/systemd/system/threatfox-block.service <<'BLOCKSVC'
          [Unit]
          Description=Block outbound traffic to ThreatFox IOCs
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/threatfox-block.sh

          [Install]
          WantedBy=multi-user.target
          BLOCKSVC

          cat > /etc/systemd/system/threatfox-block.timer <<'BLOCKTIMER'
          [Unit]
          Description=Refresh ThreatFox IOC blocklist every 30 minutes

          [Timer]
          OnCalendar=*-*-* *:0/30
          Persistent=true

          [Install]
          WantedBy=timers.target
          BLOCKTIMER

          systemctl daemon-reload
          systemctl enable --now threatfox-block.service threatfox-block.timer
          /usr/local/bin/threatfox-block.sh || logger -t threatfox-block "bootstrap run failed; timer will retry"
          fi

          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource HermesInstance --region ${AWS::Region}

  BillingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-billing-alerts'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  BillingTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BillingTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BillingTopic

  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'Account estimated charges exceeded ${BillingAlarmThresholdUsd} USD. Billing metrics are month-to-date.'
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref BillingAlarmThresholdUsd
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref BillingTopic

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BillingTopic

  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSBudgetsActionsWithAWSResourceControlAccess

  StopHermesAtBudget:
    Type: AWS::Budgets::BudgetsAction
    DependsOn: Budget
    Properties:
      BudgetName: !Sub '${AWS::StackName}-monthly'
      ActionType: RUN_SSM_DOCUMENTS
      ApprovalModel: AUTOMATIC
      ExecutionRoleArn: !GetAtt BudgetActionRole.Arn
      ActionThreshold:
        Value: 100
        Type: PERCENTAGE
      NotificationType: ACTUAL
      Subscribers:
        - Type: SNS
          Address: !Ref BillingTopic
      Definition:
        SsmActionDefinition:
          Subtype: STOP_EC2_INSTANCES
          Region: !Ref AWS::Region
          InstanceIds:
            - !Ref HermesInstance

  HermesShutdownRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GracefulHermesStop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${HermesInstance}'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${HermesInstance}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref BillingTopic

  HermesDailyShutdown:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-daily-shutdown'
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt HermesShutdownRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref HermesInstance
          SNS_TOPIC_ARN: !Ref BillingTopic
      Code:
        ZipFile: |
          import boto3
          import time
          import os

          ec2 = boto3.client("ec2")
          ssm = boto3.client("ssm")
          sns = boto3.client("sns")

          INSTANCE_ID = os.environ["INSTANCE_ID"]
          SNS_TOPIC_ARN = os.environ["SNS_TOPIC_ARN"]


          def lambda_handler(event, context):
              try:
                  resp = ec2.describe_instances(InstanceIds=[INSTANCE_ID])
                  state = resp["Reservations"][0]["Instances"][0]["State"]["Name"]

                  if state != "running":
                      notify(f"Hermes instance is '{state}', no action taken.")
                      return {"statusCode": 200, "body": f"Instance already {state}"}

                  cmd = ssm.send_command(
                      InstanceIds=[INSTANCE_ID],
                      DocumentName="AWS-RunShellScript",
                      Parameters={"commands": ["systemctl stop hermes.service"]},
                      TimeoutSeconds=60,
                  )
                  cmd_id = cmd["Command"]["CommandId"]

                  status = "Invoked"
                  result = {}
                  for _ in range(12):
                      time.sleep(5)
                      result = ssm.get_command_invocation(
                          CommandId=cmd_id, InstanceId=INSTANCE_ID
                      )
                      status = result["Status"]
                      if status in ("Success", "Failed", "Cancelled", "TimedOut"):
                          break

                  if status == "Success":
                      ec2.stop_instances(InstanceIds=[INSTANCE_ID])
                      notify("Hermes stopped gracefully. EC2 instance is shutting down.")
                  elif status in ("Failed", "TimedOut"):
                      error_msg = result.get("StandardErrorContent", "Unknown error")
                      ec2.stop_instances(InstanceIds=[INSTANCE_ID])
                      notify(
                          f"WARNING: Hermes service stop returned '{status}'. "
                          f"Instance still stopped. Error:\n{error_msg}"
                      )
                  else:
                      notify(
                          f"WARNING: Hermes service stop still '{status}' after 60s. "
                          f"Instance not stopped — manual intervention needed."
                      )

              except Exception as e:
                  notify(f"ERROR during Hermes shutdown: {str(e)}")
                  raise


          def notify(message):
              sns.publish(
                  TopicArn=SNS_TOPIC_ARN,
                  Subject="Hermes Agent — Daily Shutdown",
                  Message=message,
              )

  DailyShutdownRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Ref DailyShutdownSchedule
      State: ENABLED
      Targets:
        - Id: hermes-daily-shutdown
          Arn: !GetAtt HermesDailyShutdown.Arn

  DailyShutdownInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HermesDailyShutdown
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyShutdownRule.Arn

Outputs:
  InstanceId:
    Value: !Ref HermesInstance
  SsmConnect:
    Value: !Sub 'aws ssm start-session --target ${HermesInstance}'
  BillingTopicArn:
    Value: !Ref BillingTopic
  BillingAlarmRegion:
    Value: !Ref AWS::Region
    Description: Deploy this stack in us-east-1 for the AWS/Billing metric alarm.
